version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tw-animate-css"
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Catch-all so ungrouped production deps (better-sqlite3, shadcn,
      # lucide-react, recharts, …) land in ONE PR instead of one-per-dep,
      # minimizing how often pnpm-lock.yaml is mutated. Named groups above
      # are evaluated first and keep precedence; majors still get their own
      # PR for scrutiny. See docs/dependabot.md.
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Hold eslint at v9 until the next.js eslint plugin set
      # (eslint-plugin-react, eslint-plugin-import, eslint-plugin-jsx-a11y)
      # publishes v10-compatible peer ranges. See #22, #31.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
