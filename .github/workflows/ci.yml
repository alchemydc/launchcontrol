name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Manual re-run escape hatch. `gh run rerun` re-enters the same queue entry, so
  # it is useless when a run is wedged server-side (queued forever, zero jobs,
  # and un-cancellable). Dispatch mints a brand-new run instead, which is the
  # only way to get CI to report again without pushing a no-op commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter web exec prisma generate

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build
